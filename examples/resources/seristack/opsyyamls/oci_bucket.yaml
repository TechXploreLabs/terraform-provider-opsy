stacks:
- name: DATASOURCE
  count: 1
  vars:
  - name: namespace
    required: true
  - name: name
    required: true
  - name: region
    required: true
  cmds:
  - |
    # unset OCI_CLI_AUTH
    # CONFIG="--config-file <update config file path> --profile DEFAULT"

    cmd=(oci $CONFIG os bucket get --region {{.Vars.region}} --namespace {{.Vars.namespace}} --name {{.Vars.name}})
    bucket_json="$(${cmd[@]})" || exit 1

    jq -n \
      --arg id "{{.Vars.namespace}}/{{.Vars.name}}" \
      --argjson data_result "$bucket_json" \
      '{id: $id, output: {bucket: $data_result.data}}'

- name: CREATE
  count: 1
  vars:
  - name: compartment_id
    required: true
  - name: namespace
    required: true
  - name: name
    required: true
  - name: region
    required: true
  - name: storage_tier
    value: Standard
  - name: auto_tiering
    value: null
  - name: versioning
    value: Disabled
  - name: kms_key_id
    value: null
  - name: freeform_tags_json
    value: null
  - name: defined_tags_json
    value: null
  cmds:
  - |
    # unset OCI_CLI_AUTH
    # CONFIG="--config-file <update config file path> --profile DEFAULT"
    cmd=(oci os bucket create --region {{.Vars.region}} --compartment-id {{.Vars.compartment_id}} --namespace {{.Vars.namespace}} --name {{.Vars.name}})
    # cmd=(oci $CONFIG os bucket create --region {{.Vars.region}} --compartment-id {{.Vars.compartment_id}} --namespace {{.Vars.namespace}} --name {{.Vars.name}})
    [ -n "{{.Vars.storage_tier}}" ] && cmd+=(--storage-tier {{.Vars.storage_tier}})
    [ -n "{{.Vars.auto_tiering}}" ] && cmd+=(--auto-tiering {{.Vars.auto_tiering}})
    [ -n "{{.Vars.versioning}}" ] && cmd+=(--versioning {{.Vars.versioning}})
    [ -n "{{.Vars.kms_key_id}}" ] && cmd+=(--kms-key-id {{.Vars.kms_key_id}})
    [ -n '{{.Vars.freeform_tags_json}}' ] && cmd+=(--freeform-tags '{{.Vars.freeform_tags_json}}')
    [ -n '{{.Vars.defined_tags_json}}' ] && cmd+=(--defined-tags '{{.Vars.defined_tags_json}}')

    set +e
    created_json="$(${cmd[@]} 2>&1)"
    rc=$?
    set -e
    if [ $rc -ne 0 ]; then
      echo "$created_json" >&2
      exit $rc
    fi

    jq -n \
      --arg id "{{.Vars.namespace}}/{{.Vars.name}}" \
      --argjson create_result "$created_json" \
      '{id: $id, output: {bucket: $create_result.data}}'

- name: READ
  count: 1
  vars:
  - name: namespace
    required: true
  - name: name
    required: true
  - name: region
    required: true
  cmds:
  - |
    # unset OCI_CLI_AUTH
    # CONFIG="--config-file <update config file path> --profile DEFAULT"

    set +e
    cmd=(oci os bucket get --region {{.Vars.region}} --namespace {{.Vars.namespace}} --name {{.Vars.name}})

    #cmd=(oci $CONFIG os bucket get --region {{.Vars.region}} --namespace {{.Vars.namespace}} --name {{.Vars.name}})
    bucket_json="$(${cmd[@]} 2>&1)"
    rc=$?
    set -e

    if [ $rc -ne 0 ]; then
      if echo "$bucket_json" | grep -qi "NotAuthorizedOrNotFound\|404\|Not Found"; then
        jq -n '{not_found: true}'
        exit 0
      fi
      echo "$bucket_json" >&2
      exit $rc
    fi

    jq -n \
      --arg id "{{.Vars.namespace}}/{{.Vars.name}}" \
      --argjson read_result "$bucket_json" \
      '{id: $id, output: {bucket: $read_result.data}}'

- name: UPDATE
  count: 1
  vars:
  - name: namespace
    required: true
  - name: name
    required: true
  - name: region
    required: true
  - name: compartment_id
    required: true
  - name: auto_tiering
    value: null
  - name: versioning
    value: Disabled
  - name: freeform_tags_json
    value: null
  - name: defined_tags_json
    value: null
  - name: storage_tier
    value: Standard
  cmds:
  - |
    # unset OCI_CLI_AUTH
    # CONFIG="--config-file <update config file path> --profile DEFAULT"
    cmd=(oci os bucket update --region {{.Vars.region}} --namespace {{.Vars.namespace}} --name {{.Vars.name}})
  
    # cmd=(oci $CONFIG os bucket update --region {{.Vars.region}} --namespace {{.Vars.namespace}} --name {{.Vars.name}})
    [ -n "{{.Vars.compartment_id}}" ] && cmd+=(--compartment-id {{.Vars.compartment_id}})
    [ -n "{{.Vars.auto_tiering}}" ] && cmd+=(--auto-tiering {{.Vars.auto_tiering}})
    [ -n "{{.Vars.versioning}}" ] && cmd+=(--versioning {{.Vars.versioning}})
    [ -n '{{.Vars.freeform_tags_json}}' ] && cmd+=(--freeform-tags '{{.Vars.freeform_tags_json}}')
    [ -n '{{.Vars.defined_tags_json}}' ] && cmd+=(--defined-tags '{{.Vars.defined_tags_json}}')

    set +e
    updated_json="$(${cmd[@]} 2>&1)"
    rc=$?
    set -e
    if [ $rc -ne 0 ]; then
      echo "$updated_json" >&2
      exit $rc
    fi

    jq -n \
      --arg id "{{.Vars.namespace}}/{{.Vars.name}}" \
      --argjson update_result "$updated_json" \
      '{id: $id, output: {bucket: $update_result.data}}'

- name: DELETE
  count: 1
  vars:
  - name: namespace
    required: true
  - name: name
    required: true
  - name: region
    required: true
  cmds:
  - |
    # unset OCI_CLI_AUTH
    # CONFIG="--config-file <update config file path> --profile DEFAULT"
    cmd=(oci os bucket delete --region {{.Vars.region}} --namespace {{.Vars.namespace}} --name {{.Vars.name}} --force)

    # cmd=(oci $CONFIG os bucket delete --region {{.Vars.region}} --namespace {{.Vars.namespace}} --name {{.Vars.name}} --force)
    "${cmd[@]}" || exit 1

    jq -n --arg id "{{.Vars.namespace}}/{{.Vars.name}}" '{id: $id, output: {deleted: true}}'

- name: RECREATE_ON
  count: 1
  cmds:
  - |
    jq -n '["namespace", "name", "region"]'
